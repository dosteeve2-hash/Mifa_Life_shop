<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-label="Mifa Life">
  <defs>
    <linearGradient id="mfBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cf5"/>
      <stop offset="1" stop-color="#1e56c8"/>
    </linearGradient>
    <linearGradient id="mfGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#eaf1fb" stop-opacity=".85"/>
    </linearGradient>
  </defs>

  <!-- Icône : sac de shopping en verre, anse en M -->
  <g>
    <rect x="18" y="18" width="124" height="124" rx="30" fill="url(#mfBlue)"/>
    <!-- reflet verre -->
    <path d="M32 40 Q80 18 128 40 L128 30 Q80 12 32 30 Z" fill="#ffffff" opacity=".22"/>
    <!-- corps du sac -->
    <rect x="42" y="62" width="76" height="58" rx="14" fill="url(#mfGlass)"/>
    <!-- anse en forme de M -->
    <path d="M56 62 V50 Q56 34 71 34 Q80 34 80 48 Q80 34 89 34 Q104 34 104 50 V62"
          fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <!-- M intérieur -->
    <path d="M58 108 V80 L74 96 L90 80 V108"
          fill="none" stroke="#2f6fed" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="103" cy="104" r="5.5" fill="#2f6fed"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Outfit, 'Segoe UI', sans-serif">
    <text x="168" y="92" font-size="52" font-weight="800" letter-spacing="-1.5" fill="#0e1c33">Mifa<tspan fill="#2f6fed"> Life</tspan></text>
    <text x="171" y="122" font-size="15" font-weight="600" letter-spacing="5.5" fill="#6b82a6">LA BOUTIQUE PREMIUM DU MALI</text>
  </g>
</svg>
