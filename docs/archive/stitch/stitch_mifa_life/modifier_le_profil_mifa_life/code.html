<body class="bg-surface font-body text-on-surface antialiased selection:bg-primary/20">
<!-- Header Navigation (TopAppBar mapping) -->
<header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md fixed top-0 w-full z-50 flex items-center px-4 h-16 w-full shadow-none">
<div class="flex items-center gap-4 w-full">
<button class="text-emerald-800 dark:text-emerald-400 hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-emerald-800 dark:text-emerald-400 font-['Plus_Jakarta_Sans'] font-bold text-lg">Edit Profile</h1>
</div>
</header>
<main class="pt-20 pb-32 px-5 max-w-2xl mx-auto space-y-8">
<!-- Profile Image Section -->
<section class="flex flex-col items-center justify-center py-6">
<div class="relative group">
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-surface-container-highest shadow-sm">
<img class="w-full h-full object-cover" data-alt="portrait of a professional West African woman with a warm smile, natural lighting, elegant business attire, soft focus urban background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAU6ZqC9dP3YtLatLU9rU2oOseS0u6N3_nnshfSzBpxQdeeXnMoX-ZwCNk19WpN2w9PyUcQEbE83npE6Eo7LYplM4QreDh7zlzgd_EvzekvOD16ApJT1oANvmFJzrUN9mTgrB_kq4zsN4aodY7evsBkGpt5yO1ilZKAEPCmsrnLGJGgFqHDBQURkFI7u8QRBF1aVqYdYlZd_lTrlL0BikgeblQ3-Uuwo98qxTb1j8Ke0B0YxWmIjrZBXVtL9868IsWRufBHC-yMivvT"/>
</div>
<button class="absolute bottom-1 right-1 bg-primary text-on-primary w-10 h-10 rounded-full flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[20px]" data-icon="edit">edit</span>
</button>
</div>
<p class="mt-4 font-headline font-bold text-on-surface text-xl">Mariam Traoré</p>
<p class="text-on-surface-variant text-sm font-medium">Bamako, Mali</p>
</section>
<!-- Form Fields -->
<section class="space-y-6">
<div class="space-y-4">
<div class="group">
<label class="block text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1.5 ml-1">Nom Complet</label>
<div class="relative bg-surface-container-highest rounded-2xl p-4 flex items-center gap-3 group-focus-within:bg-white group-focus-within:ring-2 group-focus-within:ring-primary/20 transition-all duration-300">
<span class="material-symbols-outlined text-outline" data-icon="person">person</span>
<input class="bg-transparent border-none p-0 focus:ring-0 w-full font-medium text-on-surface placeholder:text-outline" placeholder="Entrez votre nom" type="text" value="Mariam Traoré"/>
</div>
</div>
<div class="group">
<label class="block text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1.5 ml-1">Adresse Email</label>
<div class="relative bg-surface-container-highest rounded-2xl p-4 flex items-center gap-3 group-focus-within:bg-white group-focus-within:ring-2 group-focus-within:ring-primary/20 transition-all duration-300">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>
<input class="bg-transparent border-none p-0 focus:ring-0 w-full font-medium text-on-surface placeholder:text-outline" placeholder="email@exemple.com" type="email" value="mariam.traore@mifa.ml"/>
</div>
</div>
<div class="group">
<label class="block text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1.5 ml-1">Numéro de Téléphone</label>
<div class="relative bg-surface-container-highest rounded-2xl p-4 flex items-center gap-3 group-focus-within:bg-white group-focus-within:ring-2 group-focus-within:ring-primary/20 transition-all duration-300">
<div class="flex items-center gap-2 pr-3 border-r border-outline/30">
<span class="text-lg">🇲🇱</span>
<span class="text-on-surface-variant font-semibold">+223</span>
</div>
<input class="bg-transparent border-none p-0 focus:ring-0 w-full font-medium text-on-surface placeholder:text-outline" placeholder="00 00 00 00" type="tel" value="70 00 00 00"/>
</div>
</div>
</div>
</section>
<!-- Preferences & Language Bento-ish Layout -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Language Selection -->
<div class="bg-surface-container-high rounded-3xl p-6 flex flex-col justify-between">
<div>
<h3 class="font-headline font-bold text-on-surface mb-1">Langue</h3>
<p class="text-on-surface-variant text-sm mb-4">Choisissez votre langue préférée</p>
</div>
<div class="flex gap-2">
<button class="flex-1 py-2 rounded-xl bg-white text-primary font-bold text-sm shadow-sm border border-primary/10">Français</button>
<button class="flex-1 py-2 rounded-xl bg-surface-container-highest text-on-surface-variant font-semibold text-sm hover:bg-white transition-colors">Bambara</button>
</div>
</div>
<!-- Preferences Section -->
<div class="bg-surface-container-high rounded-3xl p-6 space-y-4">
<h3 class="font-headline font-bold text-on-surface">Préférences</h3>
<div class="space-y-4">

<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="chat">chat</span>
<span class="text-sm font-semibold">Notifications SMS</span>
</div>
<button class="w-12 h-6 bg-primary rounded-full relative transition-colors duration-300">
<div class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full shadow-md"></div>
</button>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#25D366]" data-icon="forum">forum</span>
<span class="text-sm font-semibold">WhatsApp</span>
</div>
<button class="w-12 h-6 bg-primary rounded-full relative transition-colors duration-300">
<div class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full shadow-md"></div>
</button>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary" data-icon="star">star</span>
<span class="text-sm font-semibold">Offres Spéciales</span>
</div>
<button class="w-12 h-6 bg-surface-container-highest rounded-full relative transition-colors duration-300">
<div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full shadow-md"></div>
</button>
</div>
</div>
</div>
</section>
<!-- Save Button -->
<section class="pt-4">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold py-4 rounded-full shadow-lg hover:shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2">

<span class="material-symbols-outlined text-[20px]" data-icon="check_circle">check_circle</span>
</button>
<button class="w-full mt-4 text-error font-semibold text-sm hover:bg-error/5 py-3 rounded-full transition-colors">

</section>

<span class="material-symbols-outlined" data-icon="explore">explore</span>
<span class="font-['Inter'] text-[11px] font-medium tracking-wide">Discover</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 opacity-60 hover:text-emerald-600 dark:hover:text-emerald-300 active:scale-98 transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="package_2">package_2</span>
<span class="font-['Inter'] text-[11px] font-medium tracking-wide">Orders</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 opacity-60 hover:text-emerald-600 dark:hover:text-emerald-300 active:scale-98 transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
<span class="font-['Inter'] text-[11px] font-medium tracking-wide">Cart</span>
</a>
<!-- ACTIVE STATE: Profile -->
<a class="flex flex-col items-center justify-center text-emerald-700 dark:text-emerald-400 ring-2 ring-emerald-700 ring-offset-4 rounded-full p-1 active:scale-98 transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-['Inter'] text-[11px] font-medium tracking-wide">Profile</span>
